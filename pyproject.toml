[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gapgpt-cli"
version = "0.1.0"
description = "A polished terminal chat client for GapGPT with themes, model picking, and local chat history."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Ehsan Shahbazi" }
]
dependencies = [
  "rich",
  "websocket-client",
  "pygments",
]

[project.urls]
Homepage = "https://github.com/EhsanShahbazii/GapGPT-CLI"
Repository = "https://github.com/EhsanShahbazii/GapGPT-CLI"

[project.scripts]
gapgpt = "gapgpt_cli.app:main"
gapcode = "gapgpt_cli.app:main"

[tool.setuptools]
packages = ["gapgpt_cli"]
py-modules = ["gapcode", "auth", "ws"]
include-package-data = true

[tool.setuptools.package-data]
gapgpt_cli = ["models.json"]
